<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AMS LNB — Figma 1:1 프로토타입</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
<style>
/* ── offplatform.admin.web_v2.0 / LNB(15670:13206 열림 · 15671:14199 닫힘) 실측 토큰 ── */
:root{
  --bg:#161616;                    /* background/primary */
  --hover:#292929;                 /* background/primary-hover (활성) */
  --text:#f4f4f4;                  /* text/primary */
  --helper:rgba(255,255,255,.56);  /* text/helper #ffffff8f */
  --placeholder:rgba(255,255,255,.4); /* text/placeholder (add/delete) */
  --border:rgba(255,255,255,.08);  /* border/primary #ffffff14 */
  --r:4px; --xs:4px; --sm:6px; --md:8px; --xl:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:#0b0b0d;min-height:100vh;font-family:'Pretendard','Pretendard Variable',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:stretch;justify-content:flex-start;}
.ms{display:inline-flex;width:20px;height:20px;flex:none;}
.ms svg{width:100%;height:100%;fill:currentColor;display:block;}

.lnb{display:flex;align-items:stretch;min-height:100vh;background:var(--bg);color:var(--text);
  font-size:14px;line-height:20px;font-weight:500;flex:none;}

/* ── IconNavigation (rail 56) ── */
.rail{width:56px;flex:none;border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:var(--xl);padding:var(--xl);}
.logo{height:20px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--text);}
.logo svg{height:20px;width:auto;display:block;}
.ricons{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--md);}
.rbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);
  color:var(--helper);cursor:pointer;border:none;background:transparent;flex:none;}
.rbtn .ms{font-size:20px;}
.rbtn:hover{background:var(--hover);}
.rbtn.active{background:var(--hover);color:var(--text);}

/* ── DetailSidebar (240) ── */
.detail{width:240px;flex:none;display:flex;flex-direction:column;gap:var(--xl);padding:var(--xl);min-width:0;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:var(--sm) var(--xl);}
.wm{display:flex;align-items:center;gap:var(--md);white-space:nowrap;}
.wm .mark{height:18px;color:var(--text);display:inline-flex;}
.wm .mark svg{height:18px;width:auto;display:block;}
.wm .sub{height:16px;color:var(--helper);display:inline-flex;}
.wm .sub svg{height:16px;width:auto;display:block;}
.iconbtn{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--text);
  cursor:pointer;border:none;background:transparent;}
.iconbtn .ms{font-size:20px;}

.nav{display:flex;flex-direction:column;}
.sec{display:flex;flex-direction:column;padding-bottom:var(--xl);}
.cap{display:flex;align-items:center;justify-content:space-between;gap:var(--md);
  padding:var(--sm) var(--xl);color:var(--helper);font-size:14px;font-weight:500;white-space:nowrap;border-radius:var(--r);}
.cap .add{color:var(--placeholder);cursor:pointer;}
.favitem{display:flex;align-items:center;gap:var(--md);padding:10px var(--xl);border-radius:var(--r);cursor:pointer;}
.favitem:hover{background:var(--hover);}
.favitem .ms{font-size:20px;}
.favitem .bk{color:var(--text);}
.favitem .lb{flex:1;min-width:0;color:var(--text);overflow:hidden;text-overflow:ellipsis;}
.favitem .del{color:var(--placeholder);}

.grp{display:flex;align-items:center;gap:var(--md);padding:10px var(--xl);border-radius:var(--r);cursor:pointer;color:var(--text);}
.grp:hover{background:var(--hover);}
.grp.active{background:var(--hover);}
.grp .gi{font-size:20px;color:var(--text);}
.grp .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.grp .car{font-size:20px;color:var(--text);}
.items{display:grid;grid-template-rows:0fr;transition:grid-template-rows .18s ease;}
.grp.open + .items{grid-template-rows:1fr;}
.items > .inner{overflow:hidden;min-height:0;}
.item{display:flex;align-items:center;padding:7px var(--xl) 7px 40px;border-radius:var(--r);cursor:pointer;
  color:var(--helper);font-size:14px;}
.item:hover{background:var(--hover);color:var(--text);}
.item.active{background:var(--hover);color:var(--text);}

body.collapsed .detail{display:none;}
</style>
</head>
<body>
<div class="lnb" id="lnb">
  <div class="rail">
    <div class="logo">__SYMBOL__</div>
    <div class="ricons" id="ricons"></div>
    <button class="rbtn account" title="계정"><span class="ms" data-i="account_circle"></span></button>
  </div>
  <div class="detail">
    <div class="hdr">
      <div class="wm"><span class="mark">__WORDMARK__</span><span class="sub">__MANAGER__</span></div>
      <button class="iconbtn" id="collapse" title="패널 접기"><span class="ms" data-i="left_panel_close"></span></button>
    </div>
    <div class="nav" id="nav"></div>
  </div>
</div>

<script>
const ICONS = __ICONS__;
function svg(name){return '<svg viewBox="0 -960 960 960" aria-hidden="true">'+(ICONS[name]||'')+'</svg>';}
document.querySelectorAll('.ms[data-i]').forEach(el=>{el.innerHTML=svg(el.getAttribute('data-i'));});

/* 레일 아이콘: page_menu_ios(토글·열림시 활성) · checkbook · signpost · robot_2 */
const RAIL = [
  {icon:'page_menu_ios', toggle:true},
  {icon:'checkbook'},
  {icon:'signpost'},
  {icon:'robot_2'},
];
const FAV = ['회원조회'];
const SECTIONS = [
  {cap:'원생∙모집', groups:[
    {icon:'people', label:'고객(원생) 관리', items:['회원조회','상담관리','FAQ','공지사항','회원 병합']},
    {icon:'person_check', label:'모집/접수 관리', items:['반관리','일괄접수/입반처리','전형관리','모집관리','접수현황']},
  ]},
  {cap:'학사∙수업', groups:[
    {icon:'article_person', label:'강좌 관리', items:['강좌','보강코드','추가영상']},
    {icon:'menu_book', label:'교재 관리', items:['기초상품','교재상품','교재그룹','연결교재']},
    {icon:'box', label:'물류(교재) 상품', items:['물류단품','간행물','물류관리']},
    {icon:'transcribe', label:'수업운영 관리', items:['수업관리']},
  ]},
  {cap:'소통', groups:[
    {icon:'question_answer', label:'메시지발송 관리', items:['메시지관리','템플릿관리','080수신거부관리']},
    {icon:'ad_group', label:'메시지그룹 관리', items:['회원그룹','광고수신동의그룹','비회원문자수신DB']},
  ]},
  {cap:'수납 ∙ 정산', groups:[
    {icon:'credit_card', label:'청구/수납 관리', items:['청구관리','납부관리','신한캠퍼스처리','결제내역관리','환불요청처리','VAN 거래이력']},
    {icon:'card_giftcard', label:'장학혜택 관리', items:['쿠폰관리']},
    {icon:'monitoring', label:'매출/정산 관리', items:['정산관리','상품정산정보관리','수업통계관리']},
  ]},
  {cap:'설정∙권한', groups:[
    {icon:'corporate_fare', label:'학원정보 관리', items:['학원관리','지점관리','공간/시설관리','영역/과목관리']},
    {icon:'cast_for_education', label:'선생님(파트너) 관리', items:['선생님관리']},
    {icon:'shield_person', label:'Admin 관리', items:['메뉴관리','권한그룹관리','운영자관리']},
    {icon:'settings', label:'System 관리', items:['공통코드관리','메모리데이터 갱신','개인정보취급관리','이용약관관리','일괄 작업 이력']},
  ]},
];

const state = {activeGroup:'고객(원생) 관리', expanded:{}, activeItem:null, collapsed:false};
const ricons = document.getElementById('ricons');
const nav = document.getElementById('nav');

function renderRail(){
  ricons.innerHTML='';
  RAIL.forEach(r=>{
    const b=document.createElement('button');
    const active = r.toggle && !state.collapsed;   // page_menu_ios = 패널 열림 시 활성
    b.className='rbtn'+(active?' active':'');
    b.innerHTML='<span class="ms">'+svg(r.icon)+'</span>';
    if(r.toggle) b.onclick=()=>{state.collapsed=!state.collapsed;document.body.classList.toggle('collapsed',state.collapsed);renderRail();};
    ricons.appendChild(b);
  });
}
function render(){
  nav.innerHTML='';
  // 즐겨찾기
  const fs=document.createElement('div'); fs.className='sec';
  const fcap=document.createElement('div'); fcap.className='cap';
  fcap.innerHTML='<span>즐겨찾기</span><span class="ms add">'+svg('add_2')+'</span>';
  fs.appendChild(fcap);
  FAV.forEach(name=>{
    const it=document.createElement('div'); it.className='favitem';
    it.innerHTML='<span class="ms bk">'+svg('bookmark')+'</span><span class="lb">'+name+'</span><span class="ms del">'+svg('delete')+'</span>';
    it.onclick=()=>{state.activeGroup='고객(원생) 관리';state.activeItem=name;render();};
    fs.appendChild(it);
  });
  nav.appendChild(fs);
  // 섹션
  SECTIONS.forEach(sec=>{
    const s=document.createElement('div'); s.className='sec';
    const cap=document.createElement('div'); cap.className='cap'; cap.innerHTML='<span>'+sec.cap+'</span>';
    s.appendChild(cap);
    sec.groups.forEach(g=>{
      const isActive = state.activeGroup===g.label;
      const isOpen = !!state.expanded[g.label];
      const grp=document.createElement('div'); grp.className='grp'+(isOpen?' open':'')+(isActive?' active':'');
      const caret = (isOpen||isActive) ? 'keyboard_arrow_up' : 'keyboard_arrow_down';
      grp.innerHTML='<span class="ms gi">'+svg(g.icon)+'</span><span class="lb">'+g.label+'</span><span class="ms car">'+svg(caret)+'</span>';
      grp.onclick=()=>{state.activeGroup=g.label;state.expanded[g.label]=!state.expanded[g.label];render();};
      s.appendChild(grp);
      const items=document.createElement('div'); items.className='items';
      const inner=document.createElement('div'); inner.className='inner';
      g.items.forEach(it=>{
        const b=document.createElement('div'); b.className='item'+(state.activeItem===it?' active':'');
        b.textContent=it; b.onclick=(e)=>{e.stopPropagation();state.activeItem=it;state.activeGroup=g.label;render();};
        inner.appendChild(b);
      });
      items.appendChild(inner); s.appendChild(items);
    });
    nav.appendChild(s);
  });
}
document.getElementById('collapse').onclick=()=>{state.collapsed=!state.collapsed;document.body.classList.toggle('collapsed',state.collapsed);renderRail();};
renderRail(); render();
</script>
</body>
</html>
