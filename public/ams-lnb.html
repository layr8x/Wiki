:root{
  /* theme/color (dark 기본) */
  --background-primary:#161616;
  --background-primary-hover:#292929;
  --text-primary:#f4f4f4;
  --text-helper:rgba(255,255,255,.56);
  --text-placeholder:rgba(255,255,255,.4);
  --border-primary:rgba(255,255,255,.08);
  --radius-sm:4px;
  --space-none:0px; --space-xs:4px; --space-sm:6px; --space-md:8px; --space-xl:12px; --space-7xl:40px;
  --icon-button-padding-sm:10px;
  --type-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  --type-body-sm-size:14px; --type-body-sm-lh:20px; --type-body-sm-weight:500;
  --motion-fast:120ms; --motion-base:200ms; --motion-ease:cubic-bezier(.2,0,.38,.9);
  --rail-w:56px; --detail-w:232px; --icon:20px; --hit:32px; /* 폭: rail56 + detail232 = 288 */
}

.lnb.light{
  --background-primary:#ffffff;
  --background-primary-hover:#f4f4f4;
  --text-primary:#161616;
  --text-helper:#1616168f;
  --text-placeholder:#16161666;
  --border-primary:#16161614;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:#0b0b0d;min-height:100vh;font-family:var(--type-family);
  -webkit-font-smoothing:antialiased;display:flex;align-items:stretch;justify-content:flex-start;}
.ms{display:inline-flex;width:var(--icon);height:var(--icon);flex:none;}
.ms svg{width:100%;height:100%;fill:currentColor;display:block;}

.lnb{display:flex;align-items:stretch;height:100vh;position:sticky;top:0;align-self:flex-start;
  background:var(--background-primary);
  color:var(--text-primary);font-size:var(--type-body-sm-size);line-height:var(--type-body-sm-lh);
  font-weight:var(--type-body-sm-weight);flex:none;transition:background var(--motion-base) var(--motion-ease);}

/* IconNavigation */
.rail{width:var(--rail-w);flex:none;border-right:1px solid var(--border-primary);
  display:flex;flex-direction:column;align-items:center;gap:var(--space-xl);padding:var(--space-xl);}
.logo{height:var(--icon);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-primary);}
.logo svg{height:var(--icon);width:auto;display:block;}
.ricons{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--space-md);}
.rbtn{width:var(--hit);height:var(--hit);display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);color:var(--text-helper);cursor:pointer;border:none;background:transparent;flex:none;
  transition:background var(--motion-fast) var(--motion-ease),color var(--motion-fast) var(--motion-ease);}
.rbtn:hover{background:var(--background-primary-hover);}
.rbtn.active{background:var(--background-primary-hover);color:var(--text-primary);}

/* DetailSidebar — 접힘 시 width 0 슬라이드 */
.detail{width:var(--detail-w);flex:none;overflow:hidden;transition:width var(--motion-base) var(--motion-ease);}
.detail-inner{width:var(--detail-w);height:100vh;display:flex;flex-direction:column;gap:var(--space-xl);padding:var(--space-xl);}
.lnb.collapsed .detail{width:0;}

.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;padding:var(--space-sm) var(--space-xl);}
.wm{display:flex;align-items:center;gap:var(--space-md);white-space:nowrap;}
.wm .mark{height:18px;color:var(--text-primary);display:inline-flex;}
.wm .mark svg{height:18px;width:auto;display:block;}
.wm .sub{height:16px;color:var(--text-helper);display:inline-flex;}
.wm .sub svg{height:16px;width:auto;display:block;}
.iconbtn{width:var(--icon);height:var(--icon);display:flex;align-items:center;justify-content:center;
  color:var(--text-primary);cursor:pointer;border:none;background:transparent;border-radius:var(--radius-sm);
  transition:background var(--motion-fast) var(--motion-ease);}
.iconbtn:hover{background:var(--background-primary-hover);}

/* 메뉴 영역만 스크롤(헤더 고정). 펼쳐서 화면을 넘기면 세로 스크롤 */
.nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--border-primary) transparent;}
.nav::-webkit-scrollbar{width:8px;}
.nav::-webkit-scrollbar-thumb{background:var(--border-primary);border-radius:999px;}
.nav::-webkit-scrollbar-thumb:hover{background:var(--text-placeholder);}
.nav::-webkit-scrollbar-track{background:transparent;}
.sec{display:flex;flex-direction:column;padding-bottom:var(--space-xl);}
.cap{display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);
  padding:var(--space-sm) var(--space-xl);color:var(--text-helper);
  font-size:var(--type-body-sm-size);font-weight:var(--type-body-sm-weight);white-space:nowrap;border-radius:var(--radius-sm);}
.cap .add{color:var(--text-placeholder);cursor:pointer;border-radius:var(--radius-sm);
  transition:color var(--motion-fast) var(--motion-ease);}
.cap .add:hover{color:var(--text-primary);}

.favitem,.grp,.item{display:flex;align-items:center;border-radius:var(--radius-sm);cursor:pointer;
  transition:background var(--motion-fast) var(--motion-ease),color var(--motion-fast) var(--motion-ease);}
.favitem{gap:var(--space-md);padding:var(--icon-button-padding-sm) var(--space-xl);}
.favitem:hover{background:var(--background-primary-hover);}
.favitem .ms{font-size:var(--icon);}
.favitem .bk{color:var(--text-primary);}
.favitem .lb{flex:1;min-width:0;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;}
.favitem .del{color:var(--text-placeholder);}

.grp{gap:var(--space-md);padding:var(--icon-button-padding-sm) var(--space-xl);color:var(--text-primary);}
.grp:hover{background:var(--background-primary-hover);}
.grp.open{background:var(--background-primary-hover);}   /* 하이라이트 = 펼쳤을 때만 */
.grp .gi{font-size:var(--icon);color:var(--text-primary);}
.grp .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.grp .car{font-size:var(--icon);color:var(--text-primary);transition:transform var(--motion-base) var(--motion-ease);}
.grp.open .car{transform:rotate(180deg);}   /* down→up 회전 = 펼쳤을 때만 */

.items{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--motion-base) var(--motion-ease);}
.grp.open + .items{grid-template-rows:1fr;}
.items > .inner{overflow:hidden;min-height:0;}
/* 하위메뉴: py-10(h40)·pl-7xl(40)·text-primary — Figma 15671:14469 실측 */
.item{padding:var(--icon-button-padding-sm) var(--space-xl) var(--icon-button-padding-sm) var(--space-7xl);
  color:var(--text-primary);font-size:var(--type-body-sm-size);}
.item:hover{background:var(--background-primary-hover);}
.item.active{background:var(--background-primary-hover);}

.shell{display:flex;align-items:stretch;min-height:100vh;width:100%;}
.content{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px;

  background:var(--ct-canvas);color:var(--ct-text);}
.content .work{flex:1;display:flex;min-height:0;padding:12px;gap:12px;}
.content .leftcol{width:250px;flex:none;display:flex;flex-direction:column;gap:8px;min-height:0;}
.content .rightcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.csearch{display:flex;flex-direction:column;gap:6px;}
.csearch .row{display:flex;gap:6px;}
.cinput,.cselect,.fyear{height:34px;border:1px solid var(--ct-line);border-radius:6px;background:var(--ct-bg);
  padding:0 10px;font:inherit;color:var(--ct-text);min-width:0;display:flex;align-items:center;}
.cselect{flex:1;justify-content:space-between;cursor:pointer;} .cinput{flex:1;}
.cinput::placeholder{color:var(--ct-muted);}
.cbtn{height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--ct-line);background:var(--ct-bg);
  color:var(--ct-text);cursor:pointer;font:inherit;white-space:nowrap;}
.cbtn.primary{background:var(--ct-navy);border-color:var(--ct-navy);color:#fff;font-weight:700;}
.filters{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;}
.fyear{justify-content:space-between;}
.flist{flex:1;border:1px solid var(--ct-line);border-radius:6px;background:var(--ct-bg);overflow:auto;min-height:40px;}
.flist .fi{padding:7px 12px;color:var(--ct-text);cursor:pointer;border-bottom:1px solid var(--ct-soft);white-space:nowrap;}
.flist .fi:hover{background:var(--ct-soft);}
.flist .fi.sel{background:var(--ct-sel);color:#fff;}
.fbot{display:flex;flex-direction:column;gap:6px;}
.ctabs{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--ct-line);padding:0 4px;flex:none;}
.ctab{padding:10px 2px;font-size:14px;font-weight:700;color:var(--ct-muted);cursor:pointer;border-bottom:2px solid transparent;}
.ctab.on{color:var(--ct-text);border-bottom-color:var(--ct-blue);}
.themebtn{margin-left:auto;height:28px;padding:0 10px;border:1px solid var(--ct-line);border-radius:6px;
  background:var(--ct-bg);color:var(--ct-text);font:inherit;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.tablewrap{flex:1;border:1px solid var(--ct-line);border-radius:6px;background:var(--ct-bg);overflow:auto;min-height:0;}
.ctable{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap;}
.ctable th{position:sticky;top:0;background:var(--ct-head);color:#4a5266;font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--ct-line);}
.ctable th .hc{display:inline-flex;align-items:center;gap:4px;}
.ctable th .so{width:14px;height:14px;color:#aab2c3;}

.ctable tr:hover td{background:#fafbfe;}
.ctable a{color:var(--ct-blue);text-decoration:none;}
.badge{display:inline-block;background:var(--ct-okbg);color:var(--ct-ok);border-radius:4px;padding:2px 12px;font-size:11px;white-space:nowrap;}
.num{color:var(--ct-blue);font-weight:600;}

/* 기본: 아무 그룹도 선택/펼침 안 됨 (전부 ∨·하이라이트 없음) */
const state={expanded:{}, activeItem:null, collapsed:false};
const ricons=document.getElementById('ricons');
const nav=document.getElementById('nav');

function applyCollapsed(){ lnbEl.classList.toggle('collapsed', state.collapsed); renderRail(); }
function renderRail(){
  ricons.innerHTML='';
  RAIL.forEach(r=>{
    const b=document.createElement('button');
    const active=r.toggle && !state.collapsed;
    b.className='rbtn'+(active?' active':'');
    b.innerHTML='<span class="ms">'+svg(r.icon)+'</span>';
    if(r.toggle) b.onclick=()=>{state.collapsed=!state.collapsed;applyCollapsed();};
    ricons.appendChild(b);
  });
}
function render(){
  nav.innerHTML='';
  const fs=document.createElement('div'); fs.className='sec';
  const fcap=document.createElement('div'); fcap.className='cap';
  fcap.innerHTML='<span>즐겨찾기</span><span class="ms add">'+svg('add_2')+'</span>';
  fs.appendChild(fcap);
  FAV.forEach(name=>{
    const it=document.createElement('div'); it.className='favitem';
    it.innerHTML='<span class="ms bk">'+svg('bookmark')+'</span><span class="lb">'+name+'</span><span class="ms del">'+svg('delete')+'</span>';
    it.onclick=()=>{state.activeItem=name;render();};
    fs.appendChild(it);
  });
  nav.appendChild(fs);
  SECTIONS.forEach(sec=>{
    const s=document.createElement('div'); s.className='sec';
    const cap=document.createElement('div'); cap.className='cap'; cap.innerHTML='<span>'+sec.cap+'</span>';
    s.appendChild(cap);
    sec.groups.forEach(g=>{
      const isOpen=!!state.expanded[g.label];
      const grp=document.createElement('div'); grp.className='grp'+(isOpen?' open':'');
      grp.innerHTML='<span class="ms gi">'+svg(g.icon)+'</span><span class="lb">'+g.label+'</span><span class="ms car">'+svg('keyboard_arrow_down')+'</span>';
      grp.onclick=()=>{state.expanded[g.label]=!state.expanded[g.label];render();};
      s.appendChild(grp);
      const items=document.createElement('div'); items.className='items';
      const inner=document.createElement('div'); inner.className='inner';
      g.items.forEach(it=>{
        const b=document.createElement('div'); b.className='item'+(state.activeItem===it?' active':'');
        b.textContent=it; b.onclick=(e)=>{e.stopPropagation();state.activeItem=it;render();};
        inner.appendChild(b);
      });
      items.appendChild(inner); s.appendChild(items);
    });
    nav.appendChild(s);
  });
}
document.getElementById('collapse').onclick=()=>{state.collapsed=!state.collapsed;applyCollapsed();};
renderRail(); render();
