name: 카카오 상담 수집 (5분마다)

# 항상 켜진 GitHub 클라우드에서 카카오 파트너센터 상담 채팅을 주기적으로 수집한다.
# (기존: 사용자 맥북의 launchd 데몬 → 노트북이 꺼지면 수집 중단. 이 워크플로는 노트북과
#  무관하게 상시 수집한다.)
#
# ⚠️ 스케줄(cron) 워크플로는 기본 브랜치(main)에 머지된 뒤부터 실제로 돌기 시작한다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   - KAKAO_PARTNER_COOKIE        : 카카오 파트너센터 로그인 쿠키 (보통 1~4주마다 갱신 필요)
#   - SUPABASE_URL                : Supabase 프로젝트 URL
#   - SUPABASE_SERVICE_ROLE_KEY   : Supabase service_role 키 (RLS 우회 — 절대 공개 금지)
# 선택 Variables:
#   - KAKAO_PARTNER_PROFILE_IDS   : 수집할 채널 ID(CSV). 미설정 시 아래 기본값 사용.
#
# 쿠키가 만료되면 이 워크플로가 "실패"로 끝나며 GitHub 이 저장소 소유자에게 알림 메일을
# 보낸다 → 그때 KAKAO_PARTNER_COOKIE Secret 만 새 값으로 갱신하면 된다.

on:
  schedule:
    - cron: '*/5 * * * *'   # 5분마다 (GitHub Actions 최소 주기; 부하에 따라 지연될 수 있음)
  workflow_dispatch: {}     # 수동 실행 버튼 (Actions 탭)

# 이전 실행이 안 끝났으면 새 실행을 대기시켜 중복 수집 방지.
concurrency:
  group: kakao-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies (prod only)
        run: npm ci --omit=dev --no-audit --prefer-offline

      - name: Collect kakao partner chats
        env:
          KAKAO_PARTNER_COOKIE: ${{ secrets.KAKAO_PARTNER_COOKIE }}
          KAKAO_PARTNER_PROFILE_IDS: ${{ vars.KAKAO_PARTNER_PROFILE_IDS || '_VGAQn,_TkpPG,_xfxilXn' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/kakao-partner-collect-once.mjs
