name: 카카오 상담 수집 (수동 폴백 — 주 수집은 Supabase Edge Function)

# ⚠️ 2026-06 이전: 주 수집을 GitHub Actions → Supabase Edge Function(kakao-collect)으로 옮김.
#   이유: 비공개 저장소 Actions 무료시간(월 ~2,000분)이 5분마다 실행으로 매달 소진돼,
#   작업이 "러너 미배정"으로 즉시 실패하고 수집이 멈췄다(6/18~). Edge Function 은 항상 켜진
#   Supabase 안에서 직접 돌아 Actions 사용시간 0 → 매달 멈추는 일이 사라진다.
#   - 함수: supabase/functions/kakao-collect/index.ts
#   - 트리거: Supabase pg_cron 'kakao-collect-dispatch' → net.http_post → 함수(5분마다)
#   - 전환 마이그레이션: supabase/migrations/20260625_kakao_collect_edge_function.sql
#
# 이 워크플로는 Edge Function 장애 시 쓰는 '수동 폴백'으로만 남긴다(자동 스케줄 제거).
# 수동 실행: Actions 탭 → 이 워크플로 → Run workflow. (그때만 Actions 시간 소량 사용)
#
# 필요한 저장소 Secrets (수동 실행 시): KAKAO_PARTNER_COOKIE, SUPABASE_URL,
#   SUPABASE_SERVICE_ROLE_KEY. 선택 Variables: KAKAO_PARTNER_PROFILE_IDS.
on:
  # 자동 schedule 제거됨 — 주 수집은 Supabase Edge Function 이 담당(Actions 0).
  workflow_dispatch: {}     # 수동 실행 전용(폴백)

# 이전 실행이 안 끝났으면 새 실행을 대기시켜 중복 수집 방지.
concurrency:
  group: kakao-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies (prod only)
        run: npm ci --omit=dev --no-audit --prefer-offline

      - name: Collect kakao partner chats
        env:
          KAKAO_PARTNER_COOKIE: ${{ secrets.KAKAO_PARTNER_COOKIE }}
          KAKAO_PARTNER_PROFILE_IDS: ${{ vars.KAKAO_PARTNER_PROFILE_IDS || '_VGAQn,_rcpPG,_TkpPG,_xfxilXn,_rkbcn' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/kakao-partner-collect-once.mjs
